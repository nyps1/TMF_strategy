version: '3.8'

services:
  timescaledb:
    image: timescale/timescaledb-ha:pg15
    container_name: tw_spread_timescaledb
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin_password
      POSTGRES_DB: spread_db
    ports:
      - "5432:5432"
    volumes:
      - timescaledb_data:/home/postgres/pgdata/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - spread_network
    restart: unless-stopped
    command: postgres -c max_connections=200 -c shared_buffers=1GB

  redis:
    image: redis:7.2.4-alpine
    container_name: tw_spread_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - spread_network
    restart: unless-stopped
    command: redis-server --appendonly yes

  tracker:
    build: .
    container_name: tw_spread_tracker
    environment:
      - SHIOAJI_API_KEY=${SHIOAJI_API_KEY}
      - SHIOAJI_SECRET_KEY=${SHIOAJI_SECRET_KEY}
      - DB_BACKEND=timescaledb
      - TIMESCALE_HOST=timescaledb
      - TIMESCALE_PORT=5432
      - TIMESCALE_USER=admin
      - TIMESCALE_PASSWORD=admin_password
      - TIMESCALE_DB=spread_db
    ports:
      - "8080:8080"
    volumes:
      - ./targets.json:/app/targets.json
    networks:
      - spread_network
    depends_on:
      - timescaledb
  api:
    build: ./backend
    container_name: tw_spread_api
    environment:
      - TIMESCALE_HOST=timescaledb
      - TIMESCALE_PORT=5432
      - TIMESCALE_USER=admin
      - TIMESCALE_PASSWORD=admin_password
      - TIMESCALE_DB=spread_db
      - TRACKER_URL=http://tracker:8080
    ports:
      - "8000:8000"
    networks:
      - spread_network
    depends_on:
      - timescaledb
      - tracker
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: tw_spread_frontend
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
    ports:
      - "3000:80"
    networks:
      - spread_network
    depends_on:
      - api
    restart: unless-stopped

volumes:
  timescaledb_data:
    name: tw_spread_timescaledb_data
  redis_data:
    name: tw_spread_redis_data

networks:
  spread_network:
    name: tw_spread_network
    driver: bridge
